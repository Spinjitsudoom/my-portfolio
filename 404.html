<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Etienne Axiak</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error-container {
            padding: 2rem;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            background: linear-gradient(135deg, var(--accent, #58a6ff), #7c6ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: var(--fg2, #8b949e);
            font-size: 1.25rem;
            margin-bottom: 2rem;
        }
        .btn {
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            background: var(--accent, #58a6ff);
            color: white;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <p>The page you're looking for has moved or doesn't exist.</p>
        <a href="index.html" class="btn">Return Home</a>
    </div>
</body>
</html>
